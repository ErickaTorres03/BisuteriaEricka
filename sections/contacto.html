<section id="contacto" class="min-h-screen bg-white relative overflow-hidden flex items-center justify-center">

    <!-- Fondo decorativo -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 
                w-[700px] h-[350px] rounded-full bg-gold-100/60 blur-3xl 
                pointer-events-none">
    </div>

    <!-- Contenido centrado -->
    <div class="max-w-xl mx-auto px-6 text-center relative z-10">

        <p class="text-xs tracking-[.25em] uppercase text-gold-600 font-medium mb-4">
            Newsletter
        </p>

        <h2 class="font-serif text-4xl md:text-5xl font-bold text-sand-900 mb-5">
            Sé la primera en enterarse
        </h2>

        <p class="text-sand-500 leading-8 mb-10 text-[.95rem] font-light">
            Suscríbete y recibe un
            <strong class="text-gold-700 font-semibold">
                10% de descuento
            </strong>
            en tu primera compra, más acceso exclusivo a nuevas colecciones.
        </p>

        <form id="nlForm" class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto">

            <input
                type="email"
                placeholder="tu@correo.com"
                required
                class="flex-1 bg-white border border-sand-200 rounded-full px-5 py-3.5 
                       text-sm text-sand-900 placeholder-sand-400 
                       focus:outline-none focus:border-gold-400 
                       focus:ring-2 focus:ring-gold-100 transition-all"
            >

            <button
                type="submit"
                class="gold-btn text-white font-semibold px-7 py-3.5 rounded-full 
                       text-sm whitespace-nowrap shadow-lg shadow-gold-500/20"
            >
                Suscribirme
            </button>

        </form>

        <p class="text-sand-400 text-xs mt-4">
            Sin spam · Baja cuando quieras
        </p>

    </div>

</section>
